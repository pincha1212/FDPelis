<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="google-site-verification" content="pAi3lcliT4Ygjtix1yapLSZVijv0ys1Ojn_vkAFHjSQ" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- [MODIFICADO] Política de seguridad para permitir recursos necesarios -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://api.themoviedb.org;
        img-src 'self' https://image.tmdb.org;
    ">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>CineApp · Películas</title>
    <meta name="description" content="Explora películas, filtra por género, busca y descubre recomendaciones.">
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- [MODIFICADO] Header con logo y formulario de búsqueda -->
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo" aria-label="CineApp inicio">🎬 CineApp</a>
            <form id="form" class="search-form" role="search">
                <input type="text" placeholder="Buscar película..." id="search" class="search-input" aria-label="Buscar películas">
            </form>
        </div>
    </header>

    <!-- [MODIFICADO] Contenedor de géneros con accesibilidad -->
    <nav id="tags" class="genre-tags" aria-label="Filtros por género"></nav>

    <!-- [MODIFICADO] Sección de recomendadas con controles laterales -->
    <section id="recommended-movies" class="recommended-section">
        <h2 class="section-title">Películas Recomendadas</h2>
        <div class="carousel-container">
            <button id="prev-recommended" class="carousel-btn" aria-label="Anterior recomendada">&#10094;</button>
            <div id="recommended-list" class="carousel-track"></div>
            <button id="next-recommended" class="carousel-btn" aria-label="Siguiente recomendada">&#10095;</button>
        </div>
    </section>

    <!-- [MODIFICADO] Overlay de detalles -->
    <div id="myNav" class="overlay">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()" aria-label="Cerrar detalles">&times;</a>
        <div class="overlay-content" id="overlay-content"></div>
        <a href="javascript:void(0)" class="arrow left-arrow" id="left-arrow" aria-label="Video anterior">&#10094;</a>
        <a href="javascript:void(0)" class="arrow right-arrow" id="right-arrow" aria-label="Video siguiente">&#10095;</a>
    </div>

    <!-- [MODIFICADO] Grid principal de películas -->
    <main id="main" class="movie-grid" aria-live="polite"></main>

    <!-- [MODIFICADO] Paginación -->
    <div class="pagination">
        <button id="prev" class="page-btn" aria-label="Página anterior">Página Anterior</button>
        <span id="current" class="current-page">1</span>
        <button id="next" class="page-btn" aria-label="Página siguiente">Página Siguiente</button>
    </div>

    <!-- [MODIFICADO] Footer -->
    <footer class="footer">
        <p class="footer-text">Creado por Federico Barzola</p>
        <p class="footer-text">Datos proporcionados por <a href="https://www.themoviedb.org/" class="footer-link">TMDB</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
